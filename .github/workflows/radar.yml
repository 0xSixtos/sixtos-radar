name: Radar IA y Web3
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Consultar fuentes y enviar a Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_EVENT: ${{ github.event_name }}
        run: |
          python3 -m unittest -v
          if [ "$RUN_EVENT" = 'workflow_dispatch' ]; then
            python3 radar.py --test
          fi
          python3 radar.py
      - name: Guardar noticias enviadas
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update radar delivery state'
              git push
            fi
          fi
