name: Tests
on:
  pull_request:
  push:
    paths:
      - '*.py'
      - 'config.json'
      - '.github/workflows/*.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest -v
